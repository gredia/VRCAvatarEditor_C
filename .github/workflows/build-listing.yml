name: Build Repo Listing

env:
  LIST_PUBLISH_DIRECTORY: Website
  AUTOMATION_PATH: ci
  PACKAGE_NAME: com.gredia.vrc-avatar-editor

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types: [completed]
  release:
    types: [published, created, edited, unpublished, deleted, released]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-listing:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package repository
        uses: actions/checkout@v4

      - name: Checkout official listing automation
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.AUTOMATION_PATH }}
          clean: false

      - name: Restore automation cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.AUTOMATION_PATH }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      - name: Build VPM listing
        run: >-
          ${{ env.AUTOMATION_PATH }}/build.cmd BuildRepoListing
          --root ${{ env.AUTOMATION_PATH }}
          --list-publish-directory $GITHUB_WORKSPACE/${{ env.LIST_PUBLISH_DIRECTORY }}
          --current-package-name ${{ env.PACKAGE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.LIST_PUBLISH_DIRECTORY }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
